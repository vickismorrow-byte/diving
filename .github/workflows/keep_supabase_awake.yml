name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 0 * * 0,2,4' # Runs automatically every Sun, Tue, Thu
  workflow_dispatch: # Allows manual testing

jobs:
  ping_db:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request
        run: |
          # Querying your specific server root
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://supabase.co")
          
          echo "Supabase Server responded with HTTP Status Code: $RESPONSE"
          
          # Allow 200, 302, or 404 because any response from YOUR URL counts as activity
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 302 ] || [ "$RESPONSE" -eq 404 ]; then
            echo "Success: Project server connection verified and activity registered!"
          else
            echo "Error: Unexpected response code $RESPONSE"
            exit 1
          fi
