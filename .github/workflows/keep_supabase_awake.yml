name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 0 * * 0,2,4' # Runs automatically every Sun, Tue, Thu
  workflow_dispatch: # Allows manual testing

jobs:
  ping_db:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request
        run: |
          # Try hitting the base database API root directly
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://supabase.co")
          
          echo "Supabase Base Server responded with HTTP Status Code: $RESPONSE"
          
          # A status code of 200 or 302 means the server is online and traffic is registered
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 302 ]; then
            echo "Success: Main database host pinged successfully!"
          else
            echo "Error: Unexpected response code $RESPONSE"
            exit 1
          fi
