name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Call heartbeat function
        run: |
          curl --request POST \
            --url "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/toggle_heartbeat" \
            --header "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --header "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
