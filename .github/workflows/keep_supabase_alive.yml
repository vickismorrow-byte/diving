name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 0 * * 0,2,4' # Runs automatically every Sun, Tue, Thu
  workflow_dispatch: # Allows manual testing

jobs:
  ping_db:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://supabase.co" \
          -H "apikey: sb_publishable_FTiUYQt0XB7d7BcsGKesDA_ERo2G-lz" \
          -H "Authorization: Bearer sb_publishable_FTiUYQt0XB7d7BcsGKesDA_ERo2G-lz" \
          -H "Content-Profile: public")
          
          echo "Supabase API responded with HTTP Status Code: $RESPONSE"
          
          # 404 is allowed because an empty database will return a 404 Not Found
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 204 ] || [ "$RESPONSE" -eq 404 ]; then
            echo "Success: Database connection verified and activity registered."
          else
            echo "Error: Unexpected response code $RESPONSE"
            exit 1
          fi
